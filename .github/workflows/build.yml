name: "Build"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    name: Build Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android native toolchain
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build all plugins
        env:
          MODERN_USER_STYLES_NDK_VERSION: "28.2.13676358"
          MODERN_USER_STYLES_CMAKE_VERSION: "3.22.1"
        run: |
          cd $GITHUB_WORKSPACE
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache make

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v6
        with:
          name: plugins
          if-no-files-found: error
          path: ${{ github.workspace }}/plugins/**/build/outputs/*.zip
